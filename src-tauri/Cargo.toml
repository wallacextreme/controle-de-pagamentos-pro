[package]
name = "controle_pagamentos_pro"
version = "1.3.0"
description = "Controle de Pagamentos PRO"
authors = ["Controle de Pagamentos PRO"]
edition = "2021"

[lib]
name = "controle_pagamentos_pro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
